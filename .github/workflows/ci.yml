# ============================================================================
# 宽带业务管理系统 · CI 流水线（G8 CI/CD）
#   触发：push 到 main / V1.0.1，或向 main 发 PR
#   阶段：后端构建+单元测试 → 前端构建校验 → 容器镜像构建（不推送）
#   说明：当前为纯校验型流水线（不推送镜像/不部署）。如需推送，可在
#        docker-image 任务接入镜像仓库登录后开启 push: true 并设置 tags。
# ============================================================================
name: CI

on:
  push:
    branches: [ main, V1.0.1 ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: 后端构建与单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & run unit tests
        run: mvn -B clean package

      - name: Upload backend jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: broadband-backend-jar
          path: backend/target/broadband-backend-1.0.0.jar

  web-admin-build:
    name: 前端构建校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  docker-image:
    name: 构建容器镜像
    runs-on: ubuntu-latest
    needs: [ backend-build-test, web-admin-build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: broadband-backend:ci
