# ============================================================================
# 宽带业务管理系统 · 生产 Nginx 配置（M15-DEP 上线保障）
#
# 部署拓扑：
#   浏览器 ──HTTPS(443)──► Nginx ──静态资源──► web-admin/dist
#                              └──/api/────► Spring Boot :8082（仅监听 127.0.0.1）
#
# 安全要点（对应 docs/安全检查清单.md 门禁项）：
#   1) 全站 HTTPS：80 端口仅做跳转，禁止明文承载业务（清单第 23 项）
#   2) 后端 :8082 不对公网暴露：容器/进程只监听回环，外部无法直连（清单第 24 项）
#   3) /actuator/** 仅内网可访问，公网一律 404（清单第 25 项）
#   4) 上传体积与超时收敛，避免慢请求拖垮后端
#
# 使用：
#   cp deploy/nginx.conf /etc/nginx/conf.d/broadband.conf
#   nginx -t && systemctl reload nginx
#   证书替换为真实域名证书（let's encrypt 或企业证书）
# ============================================================================

# ---------------------------------------------------------------- HTTP → HTTPS
server {
    listen 80;
    server_name broadband.example.com;

    # 放行 ACME 校验路径（certbot http-01），其余一律跳转 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS 主站
server {
    listen 443 ssl http2;
    server_name broadband.example.com;

    # ---- TLS（替换为真实证书路径）
    ssl_certificate     /etc/nginx/certs/broadband.crt;
    ssl_certificate_key /etc/nginx/certs/broadband.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 安全响应头
    add_header X-Content-Type-Options    nosniff        always;
    add_header X-Frame-Options           SAMEORIGIN     always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    # HSTS：确认全站 HTTPS 稳定后再开启，避免误配导致站点不可达
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 前端静态资源（web-admin 构建产物）
    root /var/www/broadband-admin;
    index index.html;

    # 带 hash 的构建产物可长缓存；入口文件禁止缓存，保证发版即生效
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- 后端 API 反代（:8082 仅监听 127.0.0.1）
    location /api/ {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 长连接与超时收敛：读写 60s 足够覆盖报表类聚合查询
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---- 微信支付回调（与 /api/ 同源，单独列出便于按需限流/加白名单）
    location /api/pay/notify {
        proxy_pass       http://127.0.0.1:8082;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- 监控端点：仅内网，公网直接 404（Prometheus 从内网抓取）
    location /actuator/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass       http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }

    # ---- SPA 路由回退（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 通用约束
    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/broadband.access.log;
    error_log  /var/log/nginx/broadband.error.log warn;
}
