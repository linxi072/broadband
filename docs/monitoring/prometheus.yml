global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'broadband-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 生产：替换为后端内网地址（与 Nginx 同网段）。
      # 本地 Docker 起后端时可用 host.docker.internal；同 compose 网络用服务名 backend:8082。
      - targets: ['host.docker.internal:8082']
